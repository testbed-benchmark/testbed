name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torch-testbed
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  test-install:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install the released version from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The PyPI index can lag behind the upload, so retry for a few minutes.
          for attempt in 1 2 3 4 5 6 7 8; do
            if python -m pip install --no-cache-dir "torch-testbed==${version}"; then
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done
          exit 1
      - name: Check the installed package
        run: |
          python - <<PY
          import importlib.metadata as md
          import importlib.resources as res
          import testbed

          expected = "${GITHUB_REF_NAME#v}"
          assert md.version("torch-testbed") == expected, md.version("torch-testbed")
          assert any(res.files("testbed").joinpath("recipes").rglob("*.yaml")), "recipes missing"
          PY
