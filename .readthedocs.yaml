version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Avoid the multi-GB CUDA wheels from PyPI.
    pre_install:
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

python:
  install:
    - method: pip
      path: .
      extra_requirements: [docs]

sphinx:
  configuration: docs/conf.py
