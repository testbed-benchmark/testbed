[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-screening-pilot"
version = "0.1.0"
description = "Adaptive screening experiment with a fixed eligibility rule"
requires-python = ">=3.11,<3.14"
dependencies = ["jax>=0.6,<0.10", "numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "pyyaml>=6", "matplotlib>=3.8", "optax>=0.2.6,<0.3", "msgpack>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
gpu = ["jax[cuda12]>=0.6,<0.10"]

[tool.setuptools.packages.find]
include = ["screening*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
