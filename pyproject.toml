[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed"
dynamic = ["version"]
description = "TestBED is a library for Bayesian experimental design."
readme = "README.md"
license = { text = 'Apache-2.0' }
requires-python = ">=3.10,<3.14"  # hydra-core 1.3.x CLI is incompatible with Python 3.14
authors = [
    {name = 'Gavin Kerrigan', email = 'kerrigan@stats.ox.ac.uk'},
    {name = 'Marcel Hedman', email = 'marcel.hedman@jesus.ox.ac.uk'},
    {name = 'Sahel Iqbal', email = 'sahel.iqbal@stats.ox.ac.uk'}
]
urls = {Homepage = 'https://github.com/testbed-benchmark/testbed'}

dependencies = [
    'numpy>=1.24',
    "torch>=2.5",
    'pyyaml',
    'hydra-core',
    'tqdm',
]

[project.optional-dependencies]
full = [
    'matplotlib',
    'pyro-ppl',
    'wandb',
]
wandb = ['wandb']
dev = ["pytest", "pre-commit", "ruff"]
docs = [
    "sphinx", 
    "sphinx-autoapi", 
    "sphinx-autobuild", 
    "sphinx-book-theme",
    "myst-nb",
    "jupyter-cache",
]

[tool.setuptools.packages.find]
include = ["testbed*"]

[tool.setuptools.package-data]
testbed = ["recipes/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside torch: torch.compile imports torch.utils.mkldnn, which still
    # uses the deprecated torch.jit.script_method.
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning:torch.jit._script",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "D"]
"examples/*.py" = ["D"]

[tool.ruff.lint]
extend-select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools_scm]
