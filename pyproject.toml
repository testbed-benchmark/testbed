[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed"
dynamic = ["version"]
description = "TestBED is a library for Bayesian experimental design."
readme = "README.md"
license = { text = 'Apache-2.0' }
requires-python = ">=3.10"
authors = [
    {name = 'Gavin Kerrigan', email = 'kerrigan@stats.ox.ac.uk'},
    {name = 'Marcel Hedman', email = 'marcel.hedman@jesus.ox.ac.uk'},
    {name = 'Sahel Iqbal', email = 'sahel.iqbal@stats.ox.ac.uk'}
]
urls = {Homepage = 'https://github.com/testbed-benchmark/testbed'}

dependencies = [
    'numpy>=1.24',
    "torch>=2.1",
    'pyyaml',
    'hydra-core',
]

[project.optional-dependencies]
full = [
    'matplotlib',
    'jupyterlab',
    'notebook',
    'pyro-ppl',
    'wandb',
]
wandb = ['wandb']
dev = ["pytest", "pre-commit", "ruff", 'rich']
docs = ["sphinx", "sphinx-autoapi", "sphinx-autobuild", "myst-parser", "sphinx-book-theme"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # where to look

[tool.ruff]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "D"]
"examples/*.py" = ["D"]
"testbed/notebooks/**.ipynb" = ["D", "I"]

[tool.ruff.lint]
extend-select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools_scm]
