# Seed sweep for experiments/architecture/stochastic_pendulum/dad_deepset_large_time.
#
# Part of the architecture ablation: every recipe under
# experiments/architecture inherits its benchmarking counterpart and swaps only
# the policy net, so the architecture is the only thing that varies.
#
# wandb sweep sweeps/architecture/stochastic_pendulum_dad_deepset_large_time.yaml

name: architecture-stochastic_pendulum-dad_deepset_large_time-seeds
program: scripts/sweep_run.py
method: grid
entity: rainml-testbed
project: architecture_stochastic_pendulum

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  # Pinned here as well as in the recipe: the sweep's own project field only
  # controls where the agent registers the sweep, not where the run logs.
  wandb.project:
    value: architecture_stochastic_pendulum

command:
  - ${interpreter}
  - ${program}
  - --recipe
  - experiments/architecture/stochastic_pendulum/dad_deepset_large_time
  - ${args_no_hyphens}
