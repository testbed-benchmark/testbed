# Seed sweep for experiments/benchmarking/constant_elasticity_of_substitution/joint_var_post_single_gaussian.
#
# Posterior-expressiveness ablation: inherits the benchmark joint_var_post
# recipe and drops the mixture to a single Gaussian, so the component count is
# the only thing that varies.
#
# wandb sweep sweeps/benchmarking/constant_elasticity_of_substitution_joint_var_post_single_gaussian.yaml

name: benchmarking-constant_elasticity_of_substitution-joint_var_post_single_gaussian-seeds
program: scripts/sweep_run.py
method: grid
entity: rainml-testbed
project: benchmarking_constant_elasticity_of_substitution

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  # Pinned here as well as in the recipe: the sweep's own project field only
  # controls where the agent registers the sweep, not where the run logs.
  wandb.project:
    value: benchmarking_constant_elasticity_of_substitution

command:
  - ${interpreter}
  - ${program}
  - --recipe
  - experiments/benchmarking/constant_elasticity_of_substitution/joint_var_post_single_gaussian
  - ${args_no_hyphens}
