# Seed sweep for experiments/benchmarking/stochastic_pendulum/rlboed.

name: stochastic_pendulum-rlboed-benchmark-seeds
program: scripts/sweep_run.py
method: grid
entity: rainml-testbed
project: benchmarking_stochastic_pendulum

parameters:
