# Seed sweep for experiments/location_finding_2src/dad with the DAD paper's
# DeepSets policy and the reparametrised (pathwise) sPCE gradient.
#
# net/deepset_policy is the Appendix D.1 architecture, and D.1 states the
# likelihood is reparametrisable so Eq. 14 is used. The optimiser settings stay
# on the recipe rather than following D.1 (which uses L = 2000, 2000 outer
# samples, lr 5e-5, betas (0.8, 0.998), gamma 0.98 every 1000 steps, 50k steps,
# T = 10)
#
# Pathwise gradients need outcomes that carry a graph, hence
# task.reparameterize_outcomes=true. It is the task default, set here to make
# the contrast with the reinforce sweep explicit.
#
# wandb sweep sweeps/location_finding_2src_dad_deepset_reparam.yaml

name: location_finding_2src-dad-deepset-reparam-seeds
program: scripts/sweep_run.py
method: grid
entity: rainml-testbed
project: location_finding_2src

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  objective.name:
    value: spce
  task.reparameterize_outcomes:
    value: true
  # Separate group so these runs are distinguishable from the attentive-policy
  # `dad` set and from the reinforce arm.
  wandb.group:
    value: dad_deepset_reparam

# The architecture is fixed rather than swept, so it goes here as a literal
# override. It has to: wandb validates parameter names against
# ^[A-Za-z_][A-Za-z0-9_.-]*$, which rejects the `@` in Hydra's group-override
# syntax. Dotted parameter names above are fine.
command:
  - ${interpreter}
  - ${program}
  - --recipe
  - experiments/location_finding_2src/dad
  - net@design_net=deepset_policy
  - ${args_no_hyphens}
