# Seed sweep for experiments/location_finding_2src/joint_var_post
#
# Joint variational posterior baseline, to be compared against dad on the same
# task. Regenerate with scripts/generate_seed_sweeps.py.
#
# wandb sweep sweeps/location_finding_2src_joint_var_post.yaml

name: location_finding_2src-joint_var_post-seeds
program: scripts/sweep_run.py
method: grid
entity: rainml-testbed
project: location_finding_2src

parameters:
  seed:
    values: [0, 1, 2, 3, 4]

command:
  - ${interpreter}
  - ${program}
  - --recipe
  - experiments/location_finding_2src/joint_var_post
  - ${args_no_hyphens}
