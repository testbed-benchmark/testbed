# Seed sweep for experiments/temporal_discounting/dad with the leave-one-out
# baseline on the REINFORCE score term.
#
# The score-function multiplier is (c + g_L) for a constant c that leaves the
# gradient unbiased (E[score] = 0). The recipe default sits at c = +1, so the
# multiplier averages ~+5.5; the leave-one-out baseline centres it near 0,
# removing the (mean multiplier)^2 * Var[score] contribution to the noise.
# Tests whether that variance explains the ~0.45 nat shortfall against the DAD
# paper's HTD result (sPCE 5.021, Foster et al. 2021 Table 3).
#
# wandb sweep sweeps/temporal_discounting_dad_loo.yaml

name: temporal_discounting-dad-loo-seeds
program: scripts/sweep_run.py
method: grid
entity: rainml-testbed
project: temporal_discounting

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  objective.baseline:
    value: leave_one_out
  # Separate group so these runs are distinguishable from the baseline-free
  # `dad` set, which is otherwise identically named.
  wandb.group:
    value: dad_loo

command:
  - ${interpreter}
  - ${program}
  - --recipe
  - experiments/temporal_discounting/dad
  - ${args_no_hyphens}
