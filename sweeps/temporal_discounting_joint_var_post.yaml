# Seed sweep for experiments/temporal_discounting/joint_var_post
#
# Joint variational posterior baseline, to be compared against dad on the same
# task. Regenerate with scripts/generate_seed_sweeps.py.
#
# wandb sweep sweeps/temporal_discounting_joint_var_post.yaml

name: temporal_discounting-joint_var_post-seeds
program: scripts/sweep_run.py
method: grid
entity: rainml-testbed
project: temporal_discounting

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  # Separate group from the runs that modelled theta in R^2 directly. Those
  # bounds were valid, unlike CES's, just loose from the mass the mixture leaked
  # onto k < 0 and alpha < 0, so the two cohorts are still different posterior
  # families and averaging them in a table grouped by method would be wrong.
  wandb.group:
    value: joint_var_post_constrained

command:
  - ${interpreter}
  - ${program}
  - --recipe
  - experiments/temporal_discounting/joint_var_post
  - ${args_no_hyphens}
