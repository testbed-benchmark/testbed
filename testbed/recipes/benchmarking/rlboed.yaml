# @package _global_

# Shared RLBOED benchmark overrides, composed after /method: rlboed.
seed: 0
actor_architecture: attention
critic_architecture: deepset

# Attention settings are inherited from net/attentive_policy by method/rlboed.

sac:
  # Warm-up is collected inside the first iteration before its updates.
  # 3,125 collection iterations * 64 updates = 200,000 gradient steps.
  num_training_iterations: 3_125
  gradient_steps_per_iteration: 64
  policy_frequency: 1
  batch_size: 2_048  # replay transitions, not full trajectories as in DAD

eval_every: 0
# Final evaluation inherits /final_eval: default from method/rlboed.

wandb:
  group: rlboed_attention_deepset
