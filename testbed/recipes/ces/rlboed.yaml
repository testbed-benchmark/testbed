# system
seed: 373693
torch_deterministic: true
device: 'cuda'
save_dir: ???

# task
task:
  _target_: testbed.tasks.CES
T: 10

design_space:
  low: 0.01
  high: 100.0

# reward / outcome bounds
reward:
  n_contrastive: 100_000
  outcome_low: 0.0
  outcome_high: 1.0

eval_every: 500
eval_n_contrastive: 1_000_000

# SAC hyperparameters
sac:
  num_training_iterations: 20_001
  num_envs: 100
  buffer_size: 1_000_000
  buffer_device: gpu
  gamma: 0.9
  tau: 0.005
  batch_size: 4096
  learning_starts: 100_000
  gradient_steps_per_iteration: 64
  policy_lr: 0.0003
  q_lr: 0.0003
  policy_init_std: 0.5773502691896258  # 3 ** -0.5
  policy_frequency: 1
  target_network_frequency: 1
  alpha: null
  initial_alpha: 1.0
  target_entropy: null  # -> -numel(design) = -6
  entropy_anneal_rate: 7.142857142857143e-05  # 1 / 1.4e4
  log_frequency: 100

# experiment tracking
wandb:
  enabled: false             # opt-in; flip to true or override on the CLI
  project: testbed
  entity: null               # your wandb team/user; null uses the default
  mode: online               # online | offline | disabled
  tags: []
  group: null
