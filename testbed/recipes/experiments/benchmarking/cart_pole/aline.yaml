# @package _global_

defaults:
  - /method: aline
  - override /task: cart_pole
  - _self_

# Fixed input scales; outcomes are unbounded and are not clipped.
# Outcome order: position, angle, linear velocity, angular velocity.
design_net:
  design_center: 0.0
  design_scale: 5.0
  outcome_center: 0.0
  outcome_scale: [10.0, 2.0, 8.0, 5.0]

train_time_budget_seconds: 43_200  # 12 hours
checkpoint_every: 2_500
# Evaluate the final checkpoint through scripts/sweep_run.py.
eval_every: 0

wandb:
  project: benchmarking_cart_pole
  group: aline-benchmark
