# @package _global_

defaults:
  - /method: dad
  - override /task: cart_pole
  - _self_

# Benchmark run of DAD on the cart pole (T = 50 force steps).

seed: 0

# budget / checkpointing
train_time_budget_seconds: 43_200  # 12 hours
checkpoint_every: 5_000

# designer
# Condition on the unconstrained designs the policy emits rather than on the
# forces in [-5, 5]. The tanh squash makes the two bijective, and the raw
# values are O(1), so the encoder needs no input normalization.
use_raw_history: true
# objective
objective:
  name: spce
  fused: true  # false falls back to the per-step loop
  n_inner: 2_000  # contrastive samples for sPCE
  reparameterize_policy: false
  baseline: null
  requires_policy_log_probs: false
# training
# n_outer is halved from the 2_048 the rest of the suite uses, and from what
# this task's joint_var_post uses. At 2_048 the sPCE backward needs more than
# the 95 GiB card: every seed died in CUDA OOM on the first step, holding ~79
# GiB of activations over the [n_outer * n_inner, T, ...] contrastive scoring.
# joint_var_post has no contrastive axis, so it fits at 2_048 and is unchanged.
# The LR is constant here, so n_train_iter is a free, deliberately non-binding
# cap; the 12h clock ends the run. 
n_train_iter: 1_000_000
n_outer: 1_024

# eval
eval_every: 0  # the final_eval block handles it

wandb:
  project: benchmarking_cart_pole  # the sweep pins the same value
  group: dad_attention_2000
