# @package _global_

defaults:
  - /method: rlboed
  - override /task: constant_elasticity_of_substitution
  - _self_

task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: 0.01
    high: 100.0
    event_shape: [6]

reward:
  outcome_low: 0.0
  outcome_high: 1.0
  n_contrastive: 100_000

train_time_budget_seconds: 43_200  # 12 hours

sac:
  num_training_iterations: 100_000
  buffer_size: 1_000_000
  tau: 0.005
  policy_lr: 0.0003
  # Cap the entropy reduction at the 20_001-iteration endpoint.
  entropy_anneal_total: 1.429  # 20_001 / 1.4e4

actor_architecture: attention
critic_architecture: deepset

wandb:
  project: benchmarking_constant_elasticity_of_substitution
  group: rlboed-benchmark
