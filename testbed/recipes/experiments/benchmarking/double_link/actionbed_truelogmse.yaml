# @package _global_

# Hyperparameter settings for ActionBED on Double Link problem
# Uses the TrueLogMSELoss

defaults:
  - /method: actionbed
  - override /task: double_link
  - override /net@action_net: null
  - _self_

seed: 0 # override on sweeps

train_time_budget_seconds: 43_200 # 12 hours
eval_every: 0  # the final_eval block handles it

wandb:
  project: benchmarking_double_link  # project = task
  group: actionbed_truelogmse # group = method

# loss
loss:
  _target_: testbed.design_objectives.TrueLogMSELoss
  reduction: mean
  transform_input: false
  transform_target: true

# training
n_train_iter: 1_000_000 # very high to avoid quitting before spending the train time budget
n_action_warmup_iter: 50_000
n_outer: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: null
lr_gamma: 0.95
lr_period: 2500
# policy networks
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: [64]
  dim_emb: 64
  num_heads: 4
  num_blocks: 2
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_y + dim_design) = 50 * (4 + 2)
  # output dim: dim_theta = 4
  dims: [300, 512, 256, 128, 4]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
