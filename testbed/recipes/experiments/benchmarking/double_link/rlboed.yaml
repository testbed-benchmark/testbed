# @package _global_

defaults:
  - /method: rlboed
  - override /task: double_link
  - _self_

actor_architecture: attention
critic_architecture: deepset

train_time_budget_seconds: 43_200  # 12 hours

# Initial normalization reference for state observations, not physical bounds.
# States outside this range are not clipped.
reward:
  outcome_low: -10.0
  outcome_high: 10.0

sac:
  num_training_iterations: 100_000
  buffer_size: 1_000_000
  policy_lr: 0.0003
  entropy_anneal_total: 1.429  # 20_001 / 1.4e4

wandb:
  project: benchmarking_double_link
  group: rlboed-benchmark
