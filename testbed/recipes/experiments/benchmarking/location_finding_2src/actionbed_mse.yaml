# @package _global_

# Hyperparameter settings for ActionBED on the 2D, 2 source LF problem
# Uses the PermutationInvariantMSELoss

defaults:
  - /method: actionbed
  - override /task: location_finding_2src
  - override /net@action_net: null
  - _self_

seed: 0 # override on sweeps

train_time_budget_seconds: 43_200 # 12 hours
eval_every: 0  # the final_eval block handles it

wandb:
  project: benchmarking_location_finding_2src  # project = task
  group: actionbed_mse # group = method

# loss
loss:
  _target_: testbed.design_objectives.PermutationInvariantMSELoss
# training
n_train_iter: 1_000_000 # very high to avoid quitting before spending the train time budget
n_action_warmup_iter: 50_000
n_outer: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: null
lr_gamma: 0.95
lr_period: 2500
# policy networks
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: [64]
  dim_emb: 64
  num_heads: 4
  num_blocks: 2
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_y + dim_design) = 30 * (1 + 2)
  # output dim: n_sources * dim_theta = 2 * 2
  dims: [90, 512, 256, 128, 4]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
