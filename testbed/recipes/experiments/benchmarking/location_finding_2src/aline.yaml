# @package _global_

defaults:
  - /method: aline
  - override /task: location_finding_2src
  - _self_

design_net:
  canonicalize_theta: true # the two sources are exchangeable

task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: -4.0
    high: 4.0
    event_shape:
      - ${task.dim_theta}

train_time_budget_seconds: 43_200  # 12 hours
checkpoint_every: 7_500
# Evaluate the final checkpoint through scripts/sweep_run.py.
eval_every: 0

wandb:
  project: benchmarking_location_finding_2src
  group: aline-benchmark
