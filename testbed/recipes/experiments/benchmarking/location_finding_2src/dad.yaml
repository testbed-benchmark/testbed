# @package _global_

defaults:
  - /method: dad
  - override /task: location_finding_2src
  - _self_

# Benchmark run of DAD on location finding (d=2, K=2, T=30).
#
# Every recipe in experiments/benchmarking shares one configuration so the
# tasks are the only thing that varies: the default AttentivePolicyNet, 200k
# gradient steps, and a pathwise gradient wherever the outcomes admit one.
#

seed: 0

# budget / checkpointing
train_time_budget_seconds: 43_200  # 12 hours
checkpoint_every: 5_000

# objective: 
objective:
  name: spce
  fused: true  # false falls back to the per-step loop
  n_inner: 2_000  # contrastive samples for sPCE
  reparameterize_policy: false
  baseline: null
  requires_policy_log_probs: false
# training
# A cap, not the budget, raised only so the 12h clock is the sole stop
# condition.
n_train_iter: 1_000_000
n_outer: 2_048

# eval
eval_every: 0  #  the final_eval block handles it

wandb:
  project: benchmarking_location_finding_2src  # the sweep pins the same value
  group: dad_attention_2000
