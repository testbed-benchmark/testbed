# @package _global_

defaults:
  - /method: var_post
  - override /task: location_finding_2src
  - _self_

# Benchmark run of the joint variational posterior on
# location finding: co-optimise the posterior and the policy on the
# Barber-Agakov lower bound, with no separate posterior-pretraining phase.
#
# The task and the policy net are identical to
# experiments/benchmarking/location_finding_2src/dad, so the two differ only in
# the objective that trains the policy. Optimiser settings follow ScoreBED's
# released code for this baseline.

seed: 0

# budget / checkpointing
train_time_budget_seconds: 43_200  # 12 hours
checkpoint_every: 5_000

joint: true

# objective: plain pathwise bound. The location-finding likelihood is
# reparameterizable, so no score term is needed.
objective:
  name: barber_agakov
  fused: true  # false falls back to the per-step loop

# no pretraining phase
n_posterior_pretrain_iter: 0
n_posterior_outer: 2_048  # unused without pretraining; kept for completeness
pretrain_design_distr: null

# policy training
# n_train_iter is a cap, not the budget, raised only so the 12h clock is the
# sole stop condition. lr_schedule_iters pins the LR horizon to the 200k this
# task's completed runs already used, so both schedules below are unchanged and
# those runs stay valid.
n_train_iter: 1_000_000
lr_schedule_iters: 200_000
n_outer: 2_048  # batch size, matching dad on this task

# policy optimizer: Adam, grad clip 1.0 (global norm),
# cosine decay from 1e-5 to 5e-6 over the run.
lr: 1e-5
betas: [0.9, 0.999]
grad_clip: 1.0
policy_cosine_alpha: 5e-6
ema_decay: 0.99  # ScoreBED's reported bounds use the EMA policy weights

# posterior optimizer: Adam, grad clip 1.0 (global norm), warmup-cosine from 0
# to a 1e-3 peak over the first 0.1% of steps, decaying to 1e-6.
posterior_lr: 1e-3
posterior_betas: [0.9, 0.999]
posterior_grad_clip: 1.0
posterior_warmup_frac: 0.001
posterior_lr_floor: 1e-6

# eval
eval_every: 0  # eval is expensive here; the final_eval block handles it

# posterior network: the shared attentive Gaussian-mixture readout, with the
# source ordering canonicalised since the K=2 sources are exchangeable.
posterior_net:
  canonicalize_theta: true

wandb:
  project: benchmarking_location_finding_2src  # the sweep pins the same value
  group: joint_var_post_attention
