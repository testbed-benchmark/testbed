# @package _global_

defaults:
  - /experiments/benchmarking/location_finding_2src/joint_var_post
  - _self_

# Ablation of the posterior's expressiveness: the benchmark run with a single
# Gaussian in place of the 10-component mixture. Everything else, including the
# task, the policy net and both optimisers, is inherited unchanged, so the
# number of mixture components is the only thing that varies.

posterior_net:
  n_components: 1

wandb:
  project: benchmarking_location_finding_2src  # the sweep pins the same value
  group: joint_var_post_single_gaussian
