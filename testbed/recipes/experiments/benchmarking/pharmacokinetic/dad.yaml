# @package _global_

defaults:
  - /method: dad
  - override /task: pharmacokinetic
  - _self_

# Benchmark run of DAD on the pharmacokinetic model (T = 10 sampling times).
#

seed: 0

# budget / checkpointing
train_time_budget_seconds: 43_200  # 12 hours
checkpoint_every: 5_000

# designer
# Condition on the unconstrained designs the policy emits rather than on the
# sampling times in [0, 24]. The tanh squash makes the two bijective, and the
# raw values are O(1), so the encoder needs no input normalization.
use_raw_history: true
# objective
objective:
  name: spce
  fused: true  # false falls back to the per-step loop
  n_inner: 2_000  # contrastive samples for sPCE
  reparameterize_policy: false
  baseline: null
  requires_policy_log_probs: false
# training
# A cap, not the budget. Set high enough that train_time_budget_seconds is always what stops it.
# The LR is constant here, so nothing is keyed to this number.
n_train_iter: 1_000_000
n_outer: 2_048

# eval
eval_every: 0  # the final_eval block handles it

wandb:
  project: benchmarking_pharmacokinetic  # the sweep pins the same value
  group: dad_attention_2000
