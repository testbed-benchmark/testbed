# @package _global_

defaults:
  - /method: var_post
  - override /task: stochastic_pendulum
  - _self_

# Benchmark run of the joint variational posterior on the stochastic pendulum:
# co-optimise the posterior and the policy on the Barber-Agakov lower bound,
# with no separate posterior-pretraining phase.

seed: 0

# budget / checkpointing
train_time_budget_seconds: 43_200  # 12 hours
checkpoint_every: 5_000

joint: true

# objective: plain pathwise bound. The Euler-Maruyama step is a differentiable
# drift plus Gaussian noise, so no score term is needed.
objective:
  name: barber_agakov
  fused: true  # false falls back to the per-step loop

# no pretraining phase
n_posterior_pretrain_iter: 0
n_posterior_outer: 2_048  # unused without pretraining; kept for completeness
pretrain_design_distr: null

# policy training
# n_train_iter is a cap, not the budget, raised only so the 12h clock is the
# sole stop condition. lr_schedule_iters pins the LR horizon to the 200k this
# task's completed runs already used, so both schedules below are unchanged and
# those runs stay valid.
n_train_iter: 1_000_000
lr_schedule_iters: 200_000
n_outer: 2_048  # batch size, matching dad on this task

# policy optimizer: Adam, grad clip 1.0 (global norm),
# cosine decay from 1e-5 to 5e-6 over the run.
lr: 1e-5
betas: [0.9, 0.999]
grad_clip: 1.0
policy_cosine_alpha: 5e-6
ema_decay: 0.99  # ScoreBED's reported bounds use the EMA policy weights

# posterior optimizer: Adam, grad clip 1.0 (global norm), warmup-cosine from 0
# to a 1e-3 peak over the first 0.1% of steps, decaying to 1e-6.
posterior_lr: 1e-3
posterior_betas: [0.9, 0.999]
posterior_grad_clip: 1.0
posterior_warmup_frac: 0.001
posterior_lr_floor: 1e-6

# eval
eval_every: 0  # eval is expensive here; the final_eval block handles it

# posterior network: attentive Gaussian-mixture readout over log theta.
#
# theta = (m, l) is strictly positive, so a mixture in theta's own coordinates
# puts mass on negative masses and lengths. StochasticPendulumPrior is exactly
# log-normal, so working in log space both respects the support and makes the
# mixture Gaussian in the coordinate the prior already is.
#
# theta_loc/theta_scale standardize that log space to the prior's own moments,
# N(0, 0.01 I). The 0.1 scale matters more here than the zero shift: the
# posterior is tighter than a prior that is already narrow, and without it the
# net would have to drive its log-scale head down by ~2.3 nats to get there.
#
# No canonicalisation: mass and length are not exchangeable.
posterior_net:
  _target_: testbed.design_nets.ConstrainedAttentiveVariationalPosteriorNet
  n_components: 10
  encoder_dim_h: 256
  dim_emb: 128
  num_heads: 4
  num_blocks: 3
  trunk_dim_h: null  # use dim_emb
  trunk_activation:
    _target_: torch.nn.GELU
    _partial_: true
  log_scale_min: -7.0
  log_scale_max: 3.0
  init_scale: 1.0
  theta_loc:
    _target_: torch.tensor
    data: [0.0, 0.0]
  theta_scale:
    _target_: torch.tensor
    data: [0.1, 0.1]  # sqrt(0.01)
  canonicalize_theta: false
  # (z_m, z_l) -> (m, l): exp on both coordinates, which is exactly the map
  # StochasticPendulumPrior pushes its normal through, so the pushforward
  # covers the prior's support and integrates to 1.
  transform:
    _target_: testbed.design_nets.BlockTransform
    raw_sizes: [2]
    theta_sizes: [2]
    transforms:
      - _target_: torch.distributions.transforms.ExpTransform

wandb:
  project: benchmarking_stochastic_pendulum  # the sweep pins the same value
  group: joint_var_post_attention
