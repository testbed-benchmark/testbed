# @package _global_

defaults:
  - /method: var_post
  - override /task: temporal_discounting
  - _self_

# Benchmark run of the joint variational posterior on
# hyperbolic temporal discounting: co-optimise the posterior and the policy on
# the Barber-Agakov lower bound, with no separate posterior-pretraining phase.
#
# The task and the policy net are identical to
# experiments/benchmarking/temporal_discounting/dad, so the two differ only in
# the objective that trains the policy. Optimiser settings follow ScoreBED's
# released code for this baseline; ScoreBED never ran HTD, so only the
# method-level settings carry over.

seed: 0
joint: true
# designer
# No use_raw_history key here: unlike dad, var_post.py derives it from the net
# (`not design_net.produces_policy_log_probs`). This deterministic net gives
# True, which is what dad sets explicitly on this task, so the policy conditions
# on the unconstrained (x_d, x_r) it emits.

# objective: outcomes are the discrete responses drawn at temperature 0, so
# they are not reparameterizable and the score term carries the gradient.
objective:
  name: barber_agakov_reinforce
  reparameterize_policy: false
  baseline: leave_one_out  # centre the score coefficient to keep its variance down
  requires_policy_log_probs: false
  use_current_prior: false

# no pretraining phase
n_posterior_pretrain_iter: 0
n_posterior_outer: 2_048  # unused without pretraining; kept for completeness
pretrain_design_distr: null

# policy training
n_train_iter: 200_000
n_outer: 2_048  # batch size, matching dad on this task

# policy optimizer: Adam, grad clip 1.0 (global norm),
# cosine decay from 1e-5 to 5e-6 over the run.
lr: 1e-5
betas: [0.9, 0.999]
grad_clip: 1.0
policy_cosine_alpha: 5e-6
ema_decay: 0.99  # ScoreBED's reported bounds use the EMA policy weights

# posterior optimizer: Adam, grad clip 1.0 (global norm), warmup-cosine from 0
# to a 1e-3 peak over the first 0.1% of steps, decaying to 1e-6.
posterior_lr: 1e-3
posterior_betas: [0.9, 0.999]
posterior_grad_clip: 1.0
posterior_warmup_frac: 0.001
posterior_lr_floor: 1e-6

# eval
eval_every: 0  # eval is expensive here; the final_eval block handles it

# posterior network: attentive Gaussian-mixture readout over (log k, alpha),
# copied from experiments/temporal_discounting/joint_var_post.
#
# k is transformed: log k ~ Normal(-4.25, 1.5) exactly, so the mixture becomes
# Gaussian in the coordinate the prior already is.
#
# alpha is not. alpha ~ HalfNormal(2) has its mode at zero, so log alpha has a
# tail decaying like e^z that no Gaussian covers; a draw near zero lands ~13
# spreads out and its gradient (~1/scale^2) overflows. Left alone, alpha leaks
# 0.3% of its mass below zero, costing 0.006 nats of tightness on a ~3.4-nat
# gain, and the bound stays valid.
#
# No canonicalisation: the two coordinates are not exchangeable (and the
# constrained net rejects the combination anyway).
posterior_net:
  _target_: testbed.design_nets.ConstrainedAttentiveVariationalPosteriorNet
  n_components: 10
  encoder_dim_h: 256
  dim_emb: 128
  num_heads: 4
  num_blocks: 3
  trunk_dim_h: null  # use dim_emb
  trunk_activation:
    _target_: torch.nn.GELU
    _partial_: true
  log_scale_min: -7.0
  log_scale_max: 3.0
  init_scale: 1.0
  theta_loc: null
  theta_scale: null
  canonicalize_theta: false
  # (z_k, alpha) -> (k, alpha): exp on k, identity on alpha. The alpha block
  # contributes nothing to the Jacobian, so the pushforward integrates to 1 over
  # the prior's support; test_htd_posterior_pushforward_normalises checks it.
  transform:
    _target_: testbed.design_nets.BlockTransform
    raw_sizes: [1, 1]
    theta_sizes: [1, 1]
    transforms:
      - _target_: torch.distributions.transforms.ExpTransform
      - _target_: torch.distributions.transforms.AffineTransform
        loc: 0.0
        scale: 1.0

wandb:
  project: benchmarking_temporal_discounting  # the sweep pins the same value
  group: joint_var_post_loo_attention
