# @package _global_

# Hyperparameter settings for ActionBED on the Michaelis-Menten problem
# Uses the MSELoss
#
# benchmarking_redo: the design net is left at the net/attentive_policy default
# (~663k params) instead of the ~117k override the benchmarking copy used, so
# ActionBED is matched on policy capacity with the dad recipe. lr_period
# 2500 -> 1500 keeps the LR annealing on schedule under the 12h wall-clock
# budget at the bigger net's lower step rate; grad_clip trims the late-training
# gradient spikes that budget leaves unannealed.

defaults:
  - /method: actionbed
  - override /task: michaelis_menten
  - override /net@action_net: null
  - _self_

seed: 0 # override on sweeps

train_time_budget_seconds: 43_200 # 12 hours
eval_every: 0  # the final_eval block handles it

wandb:
  project: benchmarking_michaelis_menten  # project = task
  group: actionbed_mse_big_attention # group = method

# loss
loss:
  _target_: testbed.design_objectives.MSELoss
# training
n_train_iter: 1_000_000 # very high to avoid quitting before spending the train time budget
n_action_warmup_iter: 25_000
n_outer: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: 750
lr_gamma: 0.95
lr_period: 1500
# policy networks
# design_net is intentionally absent: /method: actionbed already pulls
# /net@design_net: attentive_policy (encoder_dim_h=256, dim_emb=128,
# num_blocks=3), which is the big net this redo standardises on.
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_y + dim_design) = 20 * (1 + 1)
  # output dim: dim_theta = 2
  dims: [40, 512, 256, 128, 2]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
