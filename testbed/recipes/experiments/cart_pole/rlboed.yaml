# @package _global_

defaults:
  - /method: rlboed
  - override /task: cart_pole
  - _self_

# Attention actor over the outcome history, as in the benchmark runs.
actor_architecture: attention

# Initial normalization reference for state observations, not physical bounds.
# States outside this range are not clipped; shared task settings are unchanged.
reward:
  outcome_low: -10.0
  outcome_high: 10.0

sac:
  gamma: 0.99
  num_training_iterations: 40_000
  # Caps the per-iteration entropy anneal at the drop the reference reaches
  # in 20_001 iterations (20_001 / 1.4e4).
  entropy_anneal_total: 1.429
  buffer_size: 1_000_000
  policy_lr: 0.0003

wandb:
  project: cart_pole
  group: rlboed
