# @package _global_

defaults:
  - /method: actionbed
  # method/actionbed.yaml defaults to location_finding.
  - override /task: constant_elasticity_of_substitution
  - override /net@action_net: null
  - _self_

# ActionBED on CES, with the loss taken on a log scale.
# Key things that make this work:
# - Log-scale MSE losses
# - Using raw designs in the action and design networks

seed: 42  # single-run default; seed sweeps override this

wandb:
  project: constant_elasticity_of_substitution # project = task
  group: actionbed_ces                         # group = method

# MSE between the action net's raw output and log(theta)
loss:
  _target_: testbed.design_objectives.TrueLogMSELoss
  reduction: mean
  transform_input: false
  transform_target: True

# training
n_train_iter: 150_000
# NB: 63% of observations under random designs are censored at the boundary,
# and 38% of warmup rollouts carry no interior observation at all, so this
# phase is weak on CES. Left at the inherited value for parity.
n_action_warmup_iter: 50_000
n_outer: 2_000

# eval
eval_every: 500
n_outer_eval: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: 1.0  # matches the method default; unclipped gradients are unsafe here
lr_gamma: 0.95
lr_period: 2000
# policy networks
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: [64]
  dim_emb: 64
  num_heads: 4
  num_blocks: 2
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_design + dim_y) = T * 7
  # output dim: dim_theta (raw: log rho, 3x log alpha, log u)
  dims: [70, 512, 256, 128, 5]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
