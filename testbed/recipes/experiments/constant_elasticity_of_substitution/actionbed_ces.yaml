# @package _global_

defaults:
  - /method: actionbed_ces
  - override /net@action_net: null
  - _self_

# ActionBED on CES with a whitened theta loss and normalized design histories.
#
# Hyperparameters are inherited from experiments/.../actionbed.yaml (themselves
# the 2D 2src LF defaults, untuned for this task), with two deliberate changes:
# grad_clip is restored to 1.0, and the loss/parametrization follow
# notes/actionbed_ces_diagnosis.md.
#
# Ablation: `normalize_designs=false` reproduces the unnormalized behaviour.

seed: 42  # single-run default; seed sweeps override this

wandb:
  project: constant_elasticity_of_substitution # project = task
  group: actionbed_ces                         # group = method

# Switch off the CES action reparametrization. CESThetaSpace maps the action
# net's outputs through exp/softmax; CESWhitenedMSELoss needs them raw, since it
# reads channels 0 and 4 as log rho and standardized log u directly. The class
# is left untouched -- this only stops the task from using it as the action
# space. main() asserts this took effect.
task:
  action_space:
    _target_: testbed.core.design_spaces.DefaultDesignSpace
    event_shape: [5]

# design-history normalization (the ablation knob)
normalize_designs: false

# training
n_train_iter: 150_000
# NB: 63% of observations under random designs are censored at the boundary,
# and 38% of warmup rollouts carry no interior observation at all, so this
# phase is weak on CES -- in the diagnostic runs essentially all progress came
# from the policy phase. Left at the inherited value for comparability; worth
# revisiting.
n_action_warmup_iter: 50_000
n_outer: 2_000

# eval
eval_every: 500
n_outer_eval: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: 1.0  # actionbed.yaml sets null; unclipped gradients are unsafe here
lr_gamma: 0.95
lr_period: 2000
# policy networks
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: [64]
  dim_emb: 64
  num_heads: 4
  num_blocks: 2
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_design + dim_y) = T * 7
  # output dim: dim_theta (raw: log rho, 3 alpha logits, standardized log u)
  dims: [70, 512, 256, 128, 5]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
