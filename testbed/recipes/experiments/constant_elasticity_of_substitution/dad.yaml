# @package _global_

defaults:
  - /method: dad
  - override /task: constant_elasticity_of_substitution
  - _self_

seed: 0

checkpoint_every: 5_000

# The outcome is censored, so its pathwise gradient misses how the censoring
# probability depends on the design; train with REINFORCE instead.
task:
  reparameterize_outcomes: false

# Condition on the unconstrained designs the policy emits, which are O(1),
# rather than on the physical baskets in [0, 100]^6.
use_raw_history: true

objective:
  name: reinforce
  fused: true
  n_inner: 2_000  # contrastive samples for the sPCE reward
  reparameterize_policy: false
  baseline: leave_one_out
  requires_policy_log_probs: false

n_train_iter: 200_000
n_outer: 2_048

lr: 1e-4
betas: [0.9, 0.999]
grad_clip: 1.0
lr_anneal_every: 1_000
lr_gamma: 0.9938

eval_every: 0
