# @package _global_

defaults:
  - /method: var_post
  - override /task: constant_elasticity_of_substitution
  - override /net@design_net: null
  - _self_

# Joint variational posterior (Foster et al. 2020) on the CES model: co-optimise
# the posterior and the policy on the Barber-Agakov bound, with no
# separate posterior-pretraining phase.
#
# Optimiser settings follow ScoreBED's
# released code for this baseline. Note ScoreBED itself never ran CES, so only
# the method-level settings carry over; everything task-shaped below is taken
# from experiments/constant_elasticity_of_substitution/dad so the two methods
# differ only in the objective that trains the policy.

seed: 0
joint: true
task:
  # Same override dad uses. Much of the outcome mass sits on the two censoring
  # atoms where _outcome_logp switches branches, so a pathwise gradient drops
  # the d(censoring probability)/d(design) term that tells the policy to leave
  # the saturated region.
  reparameterize_outcomes: false
# designer
# No use_raw_history key here: unlike dad, var_post.py derives it from the net
# (`not design_net.produces_policy_log_probs`). This deterministic net gives
# True, which is what dad sets explicitly on this task, so the policy conditions
# on the unconstrained designs it emits rather than on the baskets in [0, 100]^6.

# objective: outcomes are held fixed, so the score term carries the gradient.
objective:
  name: barber_agakov_reinforce
  reparameterize_policy: false
  baseline: leave_one_out  # centre the score coefficient to keep its variance down
  requires_policy_log_probs: false
  use_current_prior: false

# no pretraining phase
n_posterior_pretrain_iter: 0
n_posterior_outer: 1_024  # unused without pretraining; kept for completeness
pretrain_design_distr: null

# policy training
n_train_iter: 200_000
n_outer: 1_024  # batch size, matching dad on this task

# policy optimizer: Adam, grad clip 1.0 (global norm),
# cosine decay from 1e-5 to 5e-6 over the run.
lr: 1e-5
betas: [0.9, 0.999]
grad_clip: 1.0
policy_cosine_alpha: 5e-6
ema_decay: 0.99  # ScoreBED's reported bounds use the EMA policy weights

# posterior optimizer: Adam, grad clip 1.0 (global norm), warmup-cosine from 0
# to a 1e-3 peak over the first 0.1% of steps, decaying to 1e-6.
posterior_lr: 1e-3
posterior_betas: [0.9, 0.999]
posterior_grad_clip: 1.0
posterior_warmup_frac: 0.001
posterior_lr_floor: 1e-6

# eval
eval_every: 0  # eval is expensive here; the final_eval block handles it

# design policy network: the same architecture dad uses on this task, so the
# methods differ only in the objective. Encoder [7 -> 64 -> 128 -> 32] + sum
# pooling, emitter [32 -> 128 -> 6], ReLU throughout, no output activation
# because BoxDesignSpace applies the tanh squash.
design_net:
  _target_: testbed.design_nets.DeepSetPolicyNet
  encoder_dim_h: [64, 128]
  dim_emb: 32
  encoder_activation:
    _target_: torch.nn.ReLU
    _partial_: true
  decoder_dim_h: [128]
  decoder_activation:
    _target_: torch.nn.ReLU
    _partial_: true

# posterior network: the shared attentive Gaussian-mixture readout over
# theta = (rho, alpha_1, alpha_2, alpha_3, u). No canonicalisation: unlike
# location finding's sources, these coordinates are not exchangeable.

wandb:
  project: constant_elasticity_of_substitution  # one project per task; methods separate by group
  group: joint_var_post
