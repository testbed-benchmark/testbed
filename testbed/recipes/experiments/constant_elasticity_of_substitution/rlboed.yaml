# @package _global_

defaults:
  - /method: rlboed
  - override /task: constant_elasticity_of_substitution
  - _self_

task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: 0.01
    high: 100.0
    event_shape: [6]

reward:
  outcome_low: 0.0
  outcome_high: 1.0
  n_contrastive: 100_000

# This recipe stops on its own iteration count, not the wall clock, so it opts
# out of the method recipe's time budget. Its iteration count already equals
# RL-BOED's, so the entropy schedule ends on the reference endpoint unaided.
train_time_budget_seconds: null

sac:
  entropy_anneal_total: null
  num_training_iterations: 20_001
  buffer_size: 1_000_000
  tau: 0.005
  policy_lr: 0.0003

final_eval:
  n_contrastive: 10_000_000

wandb:
  project: constant_elasticity_of_substitution
  group: rlboed
