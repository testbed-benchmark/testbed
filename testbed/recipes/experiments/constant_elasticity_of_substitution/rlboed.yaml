# @package _global_

defaults:
  - /method: rlboed
  - override /task: constant_elasticity_of_substitution
  - _self_

# Attention actor over the outcome history, as in the benchmark runs.
actor_architecture: attention

task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: 0.01
    high: 100.0
    event_shape: [6]

reward:
  outcome_low: 0.0
  outcome_high: 1.0
  n_contrastive: 100_000

sac:
  num_training_iterations: 40_000
  # Caps the per-iteration entropy anneal at the drop the reference reaches
  # in 20_001 iterations (20_001 / 1.4e4).
  entropy_anneal_total: 1.429
  buffer_size: 1_000_000
  tau: 0.005
  policy_lr: 0.0003

wandb:
  project: constant_elasticity_of_substitution
  group: rlboed
