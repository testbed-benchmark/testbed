# @package _global_

defaults:
  - /method: rlboed
  - _self_

# Normalization range for the outcomes; outcomes are not clipped.
reward:
  outcome_low: -3.0
  outcome_high: 10.0

# RL-BOED needs a bounded design space.
task:
  design_prior:
    _target_: testbed.core.Box
    low: -4.0
    high: 4.0
    event_shape:
      - ${task.dim_theta}
