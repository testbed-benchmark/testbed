# @package _global_

defaults:
  - /method/rlboed
  - _self_

# RL-BOED requires a bounded design space for this otherwise unbounded task.
task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: ${design_space.low}
    high: ${design_space.high}
    event_shape:
      - ${task.dim_theta}
