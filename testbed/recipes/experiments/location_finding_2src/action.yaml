# @package _global_

# An action net trained on rollouts from a frozen designer:
#
#   python -m testbed.cli.action \
#     --config-name experiments/location_finding_2src/action \
#     designer_run_dir=runs/<a finished location_finding_2src run>
#
# The run supplies the task, T and the frozen design policy; this supplies the
# loss to train the action net with, and the losses to report.

defaults:
  - /method: action
  - override /task: location_finding_2src
  - _self_

eval_every: 0  # the final_eval block handles it

wandb:
  project: location_finding_2src  # one project per task; methods separate by group
  group: action

# The sources are exchangeable, so their ordering must not count against an
# estimate -- in training or in what is reported.
loss:
  _target_: testbed.design_objectives.PermutationInvariantMSELoss
  reduction: mean

final_eval:
  losses:
    mse: null
    log_mse: null
    permutation_invariant_mse:
      _target_: testbed.design_objectives.PermutationInvariantMSELoss
    permutation_invariant_log_mse:
      _target_: testbed.design_objectives.PermutationInvariantLogMSELoss
