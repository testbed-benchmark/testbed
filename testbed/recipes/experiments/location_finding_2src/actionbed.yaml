# @package _global_

defaults:
  - /method: actionbed
  - override /task: location_finding_2src
  - override /net@action_net: null
  - _self_

# Hyperparameter settings for reproducing ActionBED on the 2D, 2 source LF problem
# See: ActionBED (Rossa et al., 2026), Table 13.

seed: 42  # single-run default; seed sweeps override this

wandb:
  project: location_finding_2src  # one project per task; methods separate by group
  group: actionbed

eval_every: 0  # the final_eval block handles it

# loss
loss:
  _target_: testbed.design_objectives.PermutationInvariantLogMSELoss
# training
n_train_iter: 150_000
n_action_warmup_iter: 50_000
n_outer: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: null
lr_gamma: 0.95
lr_period: 2500
# policy networks
# design_net is intentionally absent: /method: actionbed already pulls
# /net@design_net: attentive_policy (encoder_dim_h=256, dim_emb=128,
# num_blocks=3).
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_y + n_sources * dim_theta)
  # output dim: dim_theta
  dims: [90, 512, 256, 128, 4]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
