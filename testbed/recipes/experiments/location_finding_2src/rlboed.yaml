# @package _global_

defaults:
  - /method: rlboed
  - override /task: location_finding_2src
  - _self_

actor_architecture: attention

# Normalization range for the outcomes; outcomes are not clipped.
reward:
  outcome_low: -3.0
  outcome_high: 10.0

# RL-BOED needs a bounded design space.
task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: -4.0
    high: 4.0
    event_shape:
      - ${task.dim_theta}

sac:
  num_training_iterations: 40_000
  entropy_anneal_total: 1.429  # 20_001 * entropy_anneal_rate
