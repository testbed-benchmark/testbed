# @package _global_

defaults:
  - /method/rlboed
  - override /task: location_finding_2src
  - _self_

# The task recipe supplies its constructor settings, horizon, and bounds;
# RL-BOED additionally requires those bounds to be instantiated on the task.
task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: ${design_space.low}
    high: ${design_space.high}
    event_shape:
      - ${task.dim_theta}
