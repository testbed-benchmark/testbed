# @package _global_

defaults:
  - /method: static
  - override /task: location_finding_2src
  - _self_

n_restarts: 8
n_outer: 512
objective:
  # log(L+1) caps sPCE, and this task's EIG runs well past log(1025)=6.9, so
  # the method default would sit at its ceiling from initialization onwards.
  n_inner: 8_192
  chunk_size: null

# Selection and the reported bounds want an L the training budget can't afford;
# both run under no_grad, where chunking actually bounds memory.
select:
  n_outer: 1_024
  n_contrastive: 1_000_000
  outer_batch_size: 64
  contrastive_chunk_size: 20_000

wandb:
  project: location_finding_2src  # one project per task; methods separate by group
  group: static
