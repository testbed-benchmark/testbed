# @package _global_

defaults:
  - /method: stepdad
  - override /task: location_finding_2src
  - _self_



seed: 0

# tau = T/2, with T=30 from the task recipe.
refine_at: [15]
n_thetas: 16

# The method default of 20k is too small here. 
# Do not raise this past 2^24: EmpiricalDistribution.sample goes through
# torch.multinomial, which refuses more categories than that.
n_posterior_samples: 10_000_000

wandb:
  project: location_finding_2src  # one project per task; methods separate by group
  group: stepdad
