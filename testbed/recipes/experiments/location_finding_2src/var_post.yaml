# @package _global_

defaults:
  - /var_post
  - override /task: location_finding_2src
  - _self_

# Two-source LocationFinding: sources are exchangeable (the likelihood sums
# over sources, so it's exactly invariant to their ordering), so canonicalize
# theta by first coordinate before evaluating it under the guide/prior --
# see VarPost's docstring for why this is valid.
objective:
  canonicalize_theta: true
