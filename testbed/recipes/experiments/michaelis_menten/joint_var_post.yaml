# @package _global_

defaults:
  - /method: var_post
  - override /task: michaelis_menten
  - _self_

# the joint variational posterior on the Michaelis-Menten
# model: co-optimise the posterior and the policy on the Barber-Agakov lower
# bound, with no separate posterior-pretraining phase.
#

seed: 0

# checkpointing
checkpoint_every: 5_000

joint: true


# objective: plain pathwise bound. The response is differentiable in theta and
# the noise is Gaussian, so no score term is needed.
objective:
  name: barber_agakov
  fused: true  # false falls back to the per-step loop

# no pretraining phase
n_posterior_pretrain_iter: 0
n_posterior_outer: 2_048  # unused without pretraining; kept for completeness
pretrain_design_distr: null

# policy training
n_train_iter: 200_000
n_outer: 2_048  # batch size, matching dad on this task

# policy optimizer: Adam, grad clip 1.0 (global norm),
# cosine decay from 1e-5 to 5e-6 over the run.
lr: 1e-5
betas: [0.9, 0.999]
grad_clip: 1.0
policy_cosine_alpha: 5e-6
ema_decay: 0.99  # ScoreBED's reported bounds use the EMA policy weights

# posterior optimizer: Adam, grad clip 1.0 (global norm), warmup-cosine from 0
# to a 1e-3 peak over the first 0.1% of steps, decaying to 1e-6.
posterior_lr: 1e-3
posterior_betas: [0.9, 0.999]
posterior_grad_clip: 1.0
posterior_warmup_frac: 0.001
posterior_lr_floor: 1e-6

# eval
eval_every: 0  # eval is expensive here; the final_eval block handles it

# posterior network: attentive Gaussian-mixture readout over unconstrained theta.
#
# theta = (V_max, V_half) is Uniform(20, 200) in both coordinates, so a mixture
# in theta's own coordinates puts mass outside the prior's support. The sigmoid
# below maps each unconstrained coordinate onto exactly (20, 200), so the
# pushforward covers the support and integrates to 1.
#
# theta_loc/theta_scale stay null: the transform already bounds the output, so
# there is no offset for a zero-initialised head to learn, matching CES.
#
# No canonicalisation: V_max and V_half are not exchangeable.
posterior_net:
  _target_: testbed.design_nets.ConstrainedAttentiveVariationalPosteriorNet
  n_components: 10
  encoder_dim_h: 256
  dim_emb: 128
  num_heads: 4
  num_blocks: 3
  trunk_dim_h: null  # use dim_emb
  trunk_activation:
    _target_: torch.nn.GELU
    _partial_: true
  log_scale_min: -7.0
  log_scale_max: 3.0
  init_scale: 1.0
  theta_loc: null
  theta_scale: null
  canonicalize_theta: false
  # (z_vmax, z_vhalf) -> (V_max, V_half), each in (20, 200). The affine matches
  # MichaelisMentenPrior's own bounds, so changing those bounds means changing
  # loc/scale here too.
  transform:
    _target_: testbed.design_nets.BlockTransform
    raw_sizes: [2]
    theta_sizes: [2]
    transforms:
      - _target_: torch.distributions.transforms.ComposeTransform
        parts:
          - _target_: torch.distributions.transforms.SigmoidTransform
          - _target_: torch.distributions.transforms.AffineTransform
            loc: 20.0
            scale: 180.0

wandb:
  project: michaelis_menten  # one project per task; methods separate by group
  group: joint_var_post
