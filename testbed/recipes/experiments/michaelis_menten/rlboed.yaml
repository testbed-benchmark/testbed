# @package _global_

defaults:
  - /method: rlboed
  - override /task: michaelis_menten
  - _self_

# The likelihood mean lies in [0, 200]; the extra margin covers four standard
# deviations of observation noise at either end of that range.
reward:
  outcome_low: -10.0
  outcome_high: 210.0
  n_contrastive: 100_000

sac:
  num_training_iterations: 20_001
  buffer_size: 1_000_000
  tau: 0.005
  policy_lr: 0.0003

final_eval:
  n_contrastive: 10_000_000

wandb:
  project: michaelis_menten
  group: rlboed
