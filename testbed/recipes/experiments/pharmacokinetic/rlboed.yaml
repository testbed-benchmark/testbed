# @package _global_

defaults:
  - /method: rlboed
  - override /task: pharmacokinetic
  - _self_

# Attention actor over the outcome history, as in the benchmark runs.
actor_architecture: attention

# Use the task's standard sampling-time box [0, 24] hours.
# Normalization reference only: the log-normal prior and Gaussian observations
# are unbounded, and observations outside this range are not clipped.
# At four log-space standard deviations below the prior median V, D_V / V
# is about 49; allowing four observation-noise standard deviations gives < 70.
reward:
  outcome_low: -2.0
  outcome_high: 70.0
  n_contrastive: 100_000

sac:
  num_training_iterations: 40_000
  # Caps the per-iteration entropy anneal at the drop the reference reaches
  # in 20_001 iterations (20_001 / 1.4e4).
  entropy_anneal_total: 1.429
  buffer_size: 1_000_000
  tau: 0.005
  policy_lr: 0.0003

wandb:
  project: pharmacokinetic
  group: rlboed
