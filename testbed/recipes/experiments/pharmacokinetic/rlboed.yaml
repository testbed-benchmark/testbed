# @package _global_

defaults:
  - /method: rlboed
  - override /task: pharmacokinetic
  - _self_

actor_architecture: attention

# Normalization range for the outcomes; outcomes are not clipped. Four prior
# standard deviations below the median V give D_V / V ~ 49, and four noise
# standard deviations on top stay under 70.
reward:
  outcome_low: -2.0
  outcome_high: 70.0
  n_contrastive: 100_000

sac:
  num_training_iterations: 40_000
  entropy_anneal_total: 1.429  # total anneal of the reference 20_001-iteration schedule
  buffer_size: 1_000_000
  tau: 0.005
  policy_lr: 0.0003
