# @package _global_

defaults:
  - /method: rlboed
  - override /task: stochastic_pendulum
  - _self_

actor_architecture: attention

# Normalization range for the state observations; states are not clipped.
reward:
  outcome_low: -10.0
  outcome_high: 10.0

sac:
  gamma: 0.99
  num_training_iterations: 40_000
  entropy_anneal_total: 1.429  # total anneal of the reference 20_001-iteration schedule
  buffer_size: 1_000_000
  policy_lr: 0.0003
