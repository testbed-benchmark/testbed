# @package _global_

# ActionBED on HTD

defaults:
  - /method: actionbed
  - override /task: temporal_discounting
  - override /net@action_net: null
  - _self_

seed: 0

wandb:
  project: temporal_discounting # project = task
  group: actionbed              # group = method

# objective
# HTD's outcomes are discrete, use REINFORCE
objective:
  name: reinforce
  reparameterize_policy: false
  baseline: leave_one_out
  requires_policy_log_probs: false
  # deterministic policy -> pathwise Reinforce over the loss (DAD Eq. 16)

# MSE between the action net's raw output and log(k, alpha)
loss:
  _target_: testbed.design_objectives.TrueLogMSELoss
  reduction: mean
  transform_input: false
  transform_target: true

# training
n_train_iter: 150_000
n_action_warmup_iter: 50_000
n_outer: 2_000

# eval
eval_every: 500
n_outer_eval: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: 1.0  # matches the method default; unclipped gradients are unsafe here
lr_gamma: 0.95
lr_period: 2000
# policy networks
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: [64]
  dim_emb: 64
  num_heads: 4
  num_blocks: 2
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_design + dim_y) = T * 3
  # output dim: dim_theta (raw: log k, log alpha)
  dims: [60, 512, 256, 128, 2]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
