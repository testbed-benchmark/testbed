# @package _global_

# Hyperparameter settings for ActionBED on the HTD problem
# Uses the LogMSELoss
#
# The design net is the net/attentive_policy default (~663k params), the same
# policy capacity as the dad recipe; grad_clip trims late-training gradient
# spikes.

defaults:
  - /method: actionbed
  - override /task: temporal_discounting
  - override /net@action_net: null
  - _self_

seed: 0

eval_every: 0  # the final_eval block handles it

# HTD has discrete outcomes; use REINFORCE
objective:
  name: reinforce
  reparameterize_policy: false
  baseline: leave_one_out
  requires_policy_log_probs: false

# loss
loss:
  _target_: testbed.design_objectives.LogMSELoss

# training
n_train_iter: 150_000
n_action_warmup_iter: 25_000
n_outer: 2_000

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
grad_clip: 5.0  # REINFORCE gradient variance; unclipped is unsafe here
lr_gamma: 0.95
lr_period: 2000
# policy networks
# design_net is intentionally absent: /method: actionbed already pulls
# /net@design_net: attentive_policy (encoder_dim_h=256, dim_emb=128,
# num_blocks=3).
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_y + dim_design) = 20 * (1 + 2)
  # output dim: dim_theta = 2
  dims: [60, 512, 256, 128, 2]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
