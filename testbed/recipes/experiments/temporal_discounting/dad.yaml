# @package _global_

defaults:
  - /method: dad
  - override /task: temporal_discounting
  - override /net@design_net: null
  - _self_

# DAD on hyperbolic temporal discounting, trained with the REINFORCE gradient
# estimator (DAD paper Eq. 16). Architecture and hyperparameters follow the
# DAD paper HTD experiment (Foster et al. 2021, Appendix D.2).

seed: 0
# designer
# Condition on the unconstrained (x_d, x_r) the policy emits, as the DAD paper's
# HTD encoder does, rather than on (D_1, R_0) with D_1 unbounded and R_0 <= 100.
use_raw_history: true
# objective
objective:
  name: reinforce
  n_inner: 1_023  # contrastive samples for the sPCE reward
  reparameterize_policy: false
  baseline: null  # or leave_one_out for variance reduction
  requires_policy_log_probs: false
  # deterministic policy -> pathwise Reinforce with SPCE.reinforce_value (DAD Eq. 16)
# training
n_train_iter: 100_000
n_outer: 1_024

# optimizer
lr: 1e-4
betas: [0.9, 0.999]
grad_clip: null
lr_anneal_every: 1_000
lr_gamma: 0.96

# eval
eval_every: 0  # eval is expensive here; off for this recipe
n_outer_eval: 1_024
n_inner_eval: 100_000

# design policy network
# DeepSets net in the spirit of the DAD paper: encoder [3 -> 256 -> 256 -> 16]
# + sum pooling, emitter [16 -> 256 -> 256 -> 2], softplus throughout. Not an
# exact match to the paper's HTD net (Appendix D.2): that encoder takes the
# design only, with two 16-dim heads gated by the binary outcome, and a
# fixed-zero null encoding.


design_net:
  _target_: testbed.design_nets.DeepSetPolicyNet
  encoder_dim_h: [256, 256]
  dim_emb: 16
  encoder_activation:
    _target_: torch.nn.Softplus
    _partial_: true
  decoder_dim_h: [256, 256]
  decoder_activation:
    _target_: torch.nn.Softplus
    _partial_: true

wandb:
  project: temporal_discounting  # one project per task; methods separate by group
  group: dad
