# @package _global_

defaults:
  - /method: dad
  - override /task: temporal_discounting
  - _self_

seed: 0

checkpoint_every: 5_000

use_raw_history: true

# Discrete outcomes, so train with REINFORCE.
objective:
  name: reinforce
  fused: true
  n_inner: 2_000
  reparameterize_policy: false
  baseline: leave_one_out
  requires_policy_log_probs: false

n_train_iter: 200_000
n_outer: 2_048

lr: 1e-4
betas: [0.9, 0.999]
grad_clip: null
lr_anneal_every: 1_000
lr_gamma: 0.96

eval_every: 0
