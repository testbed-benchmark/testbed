# @package _global_

defaults:
  - /method: var_post
  - override /task: temporal_discounting
  - override /net@design_net: null
  - _self_

# Joint variational posterior (Foster et al. 2020) on hyperbolic temporal
# discounting: co-optimise the posterior and the policy on the Barber-Agakov
# lower bound, with no separate posterior-pretraining phase. See
# experiments/location_finding_2src/joint_var_post for why the joint variant is
# used rather than the frozen one.
#
# Optimiser settings follow var_post_scorebed_repro.yaml, i.e. ScoreBED's
# released code for this baseline. Note ScoreBED itself never ran HTD, so only
# the method-level settings carry over; everything task-shaped below is taken
# from experiments/temporal_discounting/dad so the two methods differ only in
# the objective that trains the policy.

seed: 0
joint: true
# designer
# No use_raw_history key here: unlike dad, var_post.py derives it from the net
# (`not design_net.produces_policy_log_probs`). This deterministic net gives
# True, which is what dad sets explicitly on this task, so the policy conditions
# on the unconstrained (x_d, x_r) it emits.

# objective: outcomes are the discrete responses drawn at temperature 0, so
# they are not reparameterizable and the score term carries the gradient.
objective:
  name: barber_agakov_reinforce
  reparameterize_policy: false
  baseline: leave_one_out  # centre the score coefficient to keep its variance down
  requires_policy_log_probs: false
  use_current_prior: false

# no pretraining phase
n_posterior_pretrain_iter: 0
n_posterior_outer: 1_024  # unused without pretraining; kept for completeness
pretrain_design_distr: null

# policy training
n_train_iter: 200_000
n_outer: 1_024  # batch size, matching dad on this task

# policy optimizer: Adam, grad clip 1.0 (global norm),
# cosine decay from 1e-5 to 5e-6 over the run.
lr: 1e-5
betas: [0.9, 0.999]
grad_clip: 1.0
policy_cosine_alpha: 5e-6
ema_decay: 0.99  # ScoreBED's reported bounds use the EMA policy weights

# posterior optimizer: Adam, grad clip 1.0 (global norm), warmup-cosine from 0
# to a 1e-3 peak over the first 0.1% of steps, decaying to 1e-6.
posterior_lr: 1e-3
posterior_betas: [0.9, 0.999]
posterior_grad_clip: 1.0
posterior_warmup_frac: 0.001
posterior_lr_floor: 1e-6

# eval
eval_every: 0  # eval is expensive here; the final_eval block handles it

# design policy network: the same architecture dad uses on this task, so the
# methods differ only in the objective. Encoder [2 -> 256 -> 256 -> 2 x 16]
# over the design alone, its two heads mixed by the binary outcome, + sum
# pooling; emitter [16 -> 256 -> 256 -> 2], softplus throughout.
design_net:
  _target_: testbed.design_nets.GatedDeepSetPolicyNet
  encoder_dim_h: [256, 256]
  dim_emb: 16
  encoder_activation:
    _target_: torch.nn.Softplus
    _partial_: true
  decoder_dim_h: [256, 256]
  decoder_activation:
    _target_: torch.nn.Softplus
    _partial_: true

# posterior network: an attentive Gaussian-mixture readout, but over 2
# unconstrained coordinates pushed forward onto theta rather than over theta
# itself. theta = (k, alpha) is supported on the positive quadrant of R^2
# (log k ~ Normal(-4.25, 1.5), alpha ~ HalfNormal(2)), so a mixture in theta's
# own coordinates leaks mass onto k < 0 and alpha < 0.
#
# This is a milder defect than CES's: the support is full-dimensional, so the
# prior and an R^2 mixture are densities w.r.t. the same measure and the
# Barber-Agakov gain stays a real bound, just a loose one. The transform is here
# for tightness, not validity. It also removes the k/alpha scale mismatch
# (k ~ 0.014 against alpha ~ 1.3) that made a shared init_scale of 1.0 two
# orders of magnitude too wide in k, and makes the posterior exactly Gaussian in
# log k, which is the shape the lognormal prior already has.
#
# No canonicalisation: the two coordinates are not exchangeable (and the
# constrained net rejects the combination anyway).
posterior_net:
  _target_: testbed.design_nets.ConstrainedAttentiveVariationalPosteriorNet
  n_components: 10
  encoder_dim_h: 256
  dim_emb: 128
  num_heads: 4
  num_blocks: 3
  trunk_dim_h: null  # use dim_emb
  trunk_activation:
    _target_: torch.nn.GELU
    _partial_: true
  log_scale_min: -7.0
  log_scale_max: 3.0
  init_scale: 1.0
  theta_loc: null
  theta_scale: null
  canonicalize_theta: false
  # 2 unconstrained coordinates -> 2 constrained ones, elementwise:
  #   (z_k, z_alpha) -> (k, alpha), both in (0, inf)
  # One block rather than two: exp is elementwise, so a single width-2 block has
  # the same block-diagonal Jacobian as two width-1 ones. Unlike CES there is no
  # floor or squash to keep in sync with the prior, so the pushforward
  # integrates to exactly 1; test_htd_posterior_pushforward_normalises checks it.
  transform:
    _target_: testbed.design_nets.BlockTransform
    raw_sizes: [2]
    theta_sizes: [2]
    transforms:
      - _target_: torch.distributions.transforms.ExpTransform

wandb:
  project: temporal_discounting  # one project per task; methods separate by group
  # Separate group from the runs that modelled theta in R^2 directly. Those
  # bounds were valid, unlike CES's, just loose from the mass the mixture leaked
  # onto k < 0 and alpha < 0, so the two cohorts are still different posterior
  # families and averaging them in a table grouped by method would be wrong.
  #
  # The group belongs here rather than in the sweep's parameters:
  # generate_seed_sweeps.py reads it from the recipe to decide which seeds are
  # already done, and rewrites the sweep YAML from scratch.
  group: joint_var_post_constrained
