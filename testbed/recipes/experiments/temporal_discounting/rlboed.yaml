# @package _global_

defaults:
  - /method: rlboed
  - override /task: temporal_discounting
  - _self_

actor_architecture: attention

# RL-BOED needs a bounded design space.
task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: [0.5, 1.0]
    high: [200.0, 99.0]
    event_shape: [2]

reward:
  outcome_low: 0.0
  outcome_high: 1.0
  n_contrastive: 100_000

sac:
  num_training_iterations: 40_000
  entropy_anneal_total: 1.429  # 20_001 * entropy_anneal_rate
  buffer_size: 1_000_000
  tau: 0.005
  policy_lr: 0.0003
