# @package _global_

defaults:
  - /method: var_post
  - override /task: temporal_discounting
  - override /net@design_net: null
  - override /net@posterior_net: null
  - _self_

seed: 0
joint: false

# Discrete outcomes, so train with REINFORCE.
objective:
  name: barber_agakov_reinforce
  reparameterize_policy: false
  baseline: null
  requires_policy_log_probs: false
  use_current_prior: false

n_posterior_pretrain_iter: 5_000
n_posterior_outer: 1_024
posterior_lr: 1e-4
posterior_grad_clip: 1.0
pretrain_design_distr: null

n_train_iter: 100_000
n_outer: 1_024

lr: 5e-5
grad_clip: 1.0

eval_every: 0
n_outer_eval: 1_024
n_inner_eval: 100_000

design_net:
  _target_: testbed.design_nets.DeepSetPolicyNet
  encoder_dim_h: [256, 256]
  dim_emb: 16
  decoder_dim_h: [128, 16]
  decoder_activation:
    _target_: torch.nn.ReLU
    _partial_: true

posterior_net:
  _target_: testbed.design_nets.DeepSetVariationalPosteriorNet
  n_components: 10
  encoder_dim_h: [256, 256]
  dim_emb: 16
  trunk_dim_h: [128, 16]
  trunk_activation:
    _target_: torch.nn.GELU
    _partial_: true
  log_scale_min: -7.0
  log_scale_max: 3.0
  init_scale: 1.0
  theta_loc: null
  theta_scale: null
  canonicalize_theta: false
