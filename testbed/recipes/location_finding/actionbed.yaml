# system
seed: 0
device: 'cuda'
save_dir: ???


# task settings
task: 
  _target_: testbed.tasks.LocationFinding 
  n_sources: 1
  dim_theta: 2
T: 10

# loss
loss:
  _target_: testbed.design_objectives.SortedMSELoss # testbed.design_objectives.MSELoss also works
  #epsilon: 1e-8  # Only needed for the LogMSE variants

# training
n_train_iter: 5_000
n_outer: 2_048

# eval
eval_every: 100
n_outer_eval: 2_048

# optimizer
lr: 1e-4
grad_clip: 1.0

# policy networks
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: 256
  dim_emb: 128
  num_heads: 4
  num_blocks: 3
  decoder_layers: 1

action_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: 256
  dim_emb: 128
  num_heads: 4
  num_blocks: 3
  decoder_layers: 1