# system
device: 'cuda'
seed: 0
save_dir: ???

# task
task:
  _target_: testbed.tasks.LocationFinding
  n_sources: 1
  dim_theta: 2
T: 10

# objective
objective:
  name: spce
  n_inner: 1_024            # contrastive samples for sPCE

# training
n_train_iter: 25_000
n_outer: 2_048

# optimizer
lr: 1e-4
grad_clip: 1.0

# eval
eval_every: 0               # eval is expensive here; off for this recipe
n_outer_eval: 2_048
n_inner_eval: 100_000

# design policy network
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: 256
  dim_emb: 128
  num_heads: 4
  num_blocks: 3
  decoder_layers: 1

# experiment tracking
wandb:
  enabled: false            # opt-in; flip to true or override on the CLI
  project: testbed
  entity: null              # your wandb team/user; null uses the default
  mode: online              # online | offline | disabled
  tags: []
  group: null