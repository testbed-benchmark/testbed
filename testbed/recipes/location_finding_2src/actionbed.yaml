# Hyperparameter settings for reproducing ActionBED on the 2D, 2 source LF problem
# See: ActionBED (Rossa et al., 2026), Table 13. 

# system
seed: 42
device: cuda
save_dir: ???
# task settings
task:
  _target_: testbed.tasks.LocationFinding
  n_sources: 2
  dim_theta: 2
  # default hyperparameters; explicitly pinning
  amplitude: 1.0
  base_signal: 0.1
  max_signal: 1e-4
  noise_scale: 0.5
T: 30
# loss
loss:
  _target_: testbed.design_objectives.PermutationInvariantMSELoss
# training
n_train_iter: 150_000
n_action_warmup_iter: 50_000
n_outer: 2_000

# eval
eval_every: 100
n_outer_eval: 2_048

# optimizer
lr: 5e-4
betas: [0.8, 0.998]
lr_gamma: 0.95
lr_period: 2000
# policy networks
design_net:
  _target_: testbed.design_nets.AttentivePolicyNet
  encoder_dim_h: [64]
  dim_emb: 64
  num_heads: 4
  num_blocks: 2
action_net:
  _target_: testbed.design_nets.MLPPolicyNet
  # input dim: T * (dim_y + n_sources * dim_theta)
  # output dim: dim_theta
  dims: [90, 512, 256, 128, 4]
  activation:
    _target_: torch.nn.GELU
    _partial_: true
# experiment tracking
wandb:
  enabled: false  # opt-in; flip to true or override on the CLI
  project: testbed
  entity: null  # your wandb team/user; null uses the default
  mode: online  # online | offline | disabled
  tags: []
  group: null
