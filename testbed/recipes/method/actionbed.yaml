# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /net@design_net: attentive_policy
  - /net@action_net: attentive_policy
  - /wandb: default
  - /final_eval: default
  - /hydra_run: default
  - _self_
# system (device/save_dir come from the system group)
seed: 0
# loss
loss:
  _target_: testbed.design_objectives.SortedMSELoss  # testbed.design_objectives.MSELoss also works
  reduction: mean
# training
n_train_iter: 5_000
n_action_warmup_iter: 0
n_outer: 2_048

# eval
eval_every: 100
n_outer_eval: 2_048

# optimizer
lr: 1e-4
betas: [0.9, 0.999]
grad_clip: 1.0
lr_period: null
lr_gamma: null
