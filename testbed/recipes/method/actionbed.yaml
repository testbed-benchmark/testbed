# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /net@design_net: attentive_policy
  - /net@action_net: attentive_policy
  - /wandb: default
  - /final_eval: default
  - /hydra_run: default
  - _self_

seed: 0
torch_deterministic: true

use_raw_history: true

# name: "loss" backpropagates the loss directly and needs reparameterizable
# outcomes; "reinforce" adds the trajectory score term for discrete outcomes.
objective:
  name: loss
  reparameterize_policy: false
  baseline: null
  requires_policy_log_probs: false

loss:
  _target_: testbed.design_objectives.PermutationInvariantMSELoss
  reduction: mean

n_train_iter: 150_000
n_action_warmup_iter: 50_000
n_outer: 2_048

eval_every: 100
n_outer_eval: 2_048

train_time_budget_seconds: null  # null for no time limit
checkpoint_every: 10_000  # 0 to disable

lr: 5e-4
betas: [0.8, 0.998]
grad_clip: null
lr_gamma: 0.95
lr_period: 2000
