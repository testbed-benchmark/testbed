# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /wandb: default
  - /final_eval: default
  - /rare_eval: default
  - /hydra_run: default
  - _self_

# system
seed: 0

# rollout
pool_size: 200

design_net:
  _target_: testbed.design_nets.AlineModel
  canonicalize_theta: false
  embedding_dim: 128
  feedforward_dim: 384
  n_heads: 4
  n_layers: 3
  dropout: 0.0
  n_components: 10
  min_scale: 1e-4
  design_center: 0.0
  design_scale: 1.0
  outcome_center: 0.0
  outcome_scale: 1.0

# training
train_time_budget_seconds: null  # no wall-clock limit by default
checkpoint_every: 7_500  # policy snapshots; 0 disables periodic saving
n_train_iter: 200_000
n_warmup_iter: 20_000
n_outer: 200
alpha: 1.0
gamma: 1.0
grad_clip: 1.0

optimizer:
  lr: 1e-3
  weight_decay: 0.01

# evaluation
eval_every: 10_000
eval_pool_size: 2_000
eval_batch_size: 50
eval_contrastive_chunk_size: 200_000
n_outer_eval: 2_048
n_inner_eval: 1_000_000
eval_deterministic: true

final_eval:
  designer:
    _target_: testbed.designers.AlineDesigner
    pool_size: ${eval_pool_size}
    deterministic: ${eval_deterministic}
