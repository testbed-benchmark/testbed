# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /wandb: default
  - /final_eval: default
  - /hydra_run: default
  - _self_

# system
seed: 0

# rollout
T: 30
pool_size: 200
task:
  design_space:
    _target_: testbed.core.design_spaces.BoxDesignSpace
    low: -4.0
    high: 4.0
    event_shape: [2]

# Acquisition always targets all task parameters using the reference mean-field posterior.

# model
model:
  embedding_dim: 32
  feedforward_dim: 128
  n_heads: 4
  n_layers: 3
  dropout: 0.0
  n_components: 10
  min_scale: 1e-4
  design_center: 0.0
  design_scale: 1.0
  outcome_center: 0.0
  outcome_scale: 1.0

# training
n_train_iter: 100_000
# max_epoch/burning_epoch in the reference config/train_bed.yaml.
n_warmup_iter: 10_000
n_outer: 200
alpha: 1.0
gamma: 1.0
grad_clip: 1.0

optimizer:
  lr: 1e-3
  weight_decay: 0.01

# evaluation
eval_every: 0
eval_pool_size: 2_000
eval_batch_size: 5
n_outer_eval: 200
n_inner_eval: 1_000
eval_deterministic: true

final_eval:
  # ALINE's transformer attends over eval_pool_size candidates, so keep the
  # outer batches as small as its periodic evaluation batches.
  outer_batch_size: ${eval_batch_size}
