# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /net@design_net: attentive_policy
  - /wandb: default
  - /final_eval: default
  - /hydra_run: default
  - _self_

seed: 0
torch_deterministic: true

# false: the policy conditions on physical designs; true: on the unconstrained
# designs it emitted, before task.design_space.to_design.
use_raw_history: false

objective:
  name: spce
  fused: true
  n_inner: 1_023  # contrastive samples for sPCE
  reparameterize_policy: false
  baseline: null
  requires_policy_log_probs: false

n_train_iter: 25_000
n_outer: 2_048

train_time_budget_seconds: null  # null for no time limit
checkpoint_every: 0  # 0 to disable

lr: 1e-4
betas: [0.9, 0.999]
grad_clip: 1.0
lr_anneal_every: null  # null: constant LR; otherwise exponential decay every this many steps
lr_gamma: null

eval_every: 0
n_outer_eval: 2_048
n_inner_eval: 100_000
