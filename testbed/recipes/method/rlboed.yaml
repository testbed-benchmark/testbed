# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /net@attention_policy: attentive_policy
  - /wandb: default
  - /final_eval: default
  - /hydra_run: default
  - _self_

# system (device/save_dir come from the system group)
seed: 0
torch_deterministic: true
# Independently selectable history encoders for the actor and critics.
# Each may be either deepset or attention.
actor_architecture: deepset
critic_architecture: deepset
# complete deployable policy
design_net:
  _target_: testbed.design_nets.make_stochastic_policy
  architecture: ${actor_architecture}
  attention:
    dim_h: ${attention_policy.encoder_dim_h}
    dim_emb: ${attention_policy.dim_emb}
    num_heads: ${attention_policy.num_heads}
    num_blocks: ${attention_policy.num_blocks}
  # DeepSet encoder and SAC head defaults. Attention encoder widths come from
  # net/attentive_policy above; unspecified options use AttentiveEncoder defaults.
  dim_h: [128, 128]
  dim_emb: 64
  log_std_min: -20.0
  log_std_max: 0.0
  init_std: 0.5773502691896258  # 3 ** -0.5
  normalize_design_history: true
  design_history_bounds: [0.0, 1.0]
  outcome_bounds:
    - ${reward.outcome_low}
    - ${reward.outcome_high}
# reward
reward:
  # Environment-specific reference range for normalizing outcome histories in
  # the policy and critic networks; experiment recipes must supply both values.
  outcome_low: ???
  outcome_high: ???
  n_contrastive: 100_000
# eval
eval_every: 0  # no periodic eval during SAC training
eval_n_contrastive: 1_000_000
train_time_budget_seconds: null
checkpoint_every: 1_000
# SAC hyperparameters
sac:
  num_training_iterations: 100_000
  num_envs: 100
  buffer_size: 10_000_000
  buffer_device: ${device}
  gamma: 0.9
  tau: 0.001
  batch_size: 4096
  learning_starts: 100_000
  gradient_steps_per_iteration: 64
  policy_lr: 0.0001
  q_lr: 0.0003
  policy_frequency: 1
  target_network_frequency: 1
  alpha: null
  initial_alpha: 1.0
  target_entropy: null
  entropy_anneal_rate: 7.143e-05  # 1 / 1.4e4, per iteration
  # No cap by default; time-limited benchmark recipes set an explicit endpoint.
  entropy_anneal_total: null
  log_frequency: 100
