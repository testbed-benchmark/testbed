# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /net@attention_policy: attentive_policy
  - /wandb: default
  - /final_eval: default
  - /hydra_run: default
  - _self_

seed: 0
torch_deterministic: true

# History encoders for the actor and the critics: deepset, deepset_time or attention.
actor_architecture: deepset
critic_architecture: deepset

design_net:
  _target_: testbed.design_nets.make_stochastic_policy
  architecture: ${actor_architecture}
  attention:
    dim_h: ${attention_policy.encoder_dim_h}
    dim_emb: ${attention_policy.dim_emb}
    num_heads: ${attention_policy.num_heads}
    num_blocks: ${attention_policy.num_blocks}
  # DeepSet encoder and SAC head; the attention encoder's widths come from
  # net/attentive_policy.
  dim_h: [128, 128]
  dim_emb: 64
  log_std_min: -20.0
  log_std_max: 0.0
  init_std: 0.5773502691896258  # 3 ** -0.5
  normalize_design_history: true
  design_history_bounds: [0.0, 1.0]
  outcome_bounds:
    - ${reward.outcome_low}
    - ${reward.outcome_high}

reward:
  # Reference range for normalizing outcome histories in the actor and critics.
  # Task-specific, so every experiment recipe sets it; outcomes are not clipped.
  outcome_low: ???
  outcome_high: ???
  n_contrastive: 100_000

eval_every: 0
eval_n_contrastive: 1_000_000
train_time_budget_seconds: null
checkpoint_every: 1_000

sac:
  num_training_iterations: 100_000
  num_envs: 100
  buffer_size: 10_000_000
  buffer_device: ${device}
  gamma: 0.9
  tau: 0.001
  batch_size: 4096
  learning_starts: 100_000
  gradient_steps_per_iteration: 64
  policy_lr: 0.0001
  q_lr: 0.0003
  policy_frequency: 1
  target_network_frequency: 1
  alpha: null
  initial_alpha: 1.0
  target_entropy: null
  entropy_anneal_rate: 7.143e-05  # 1 / 1.4e4, per iteration
  entropy_anneal_total: null  # cap on the total anneal; null for none
  log_frequency: 100
