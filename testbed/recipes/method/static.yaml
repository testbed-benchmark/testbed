# @package _global_

defaults:
  - /system: default
  - /task: location_finding
  - /wandb: default
  - /final_eval: default
  - /hydra_run: default
  - _self_

seed: 0

# Independently initialized static designs, optimized together; the best one,
# chosen by `select` below, is kept.
n_restarts: 5

objective:
  name: spce
  n_inner: 4_096  # contrastive samples for sPCE
  chunk_size: null  # null: score all contrastive samples at once
  fused: true

n_train_iter: 10_000
n_outer: 512  # per restart

lr: 5e-3
betas: [0.9, 0.999]
grad_clip: 1.0
lr_anneal_every: null  # null: constant LR; otherwise exponential decay every this many steps
lr_gamma: null

save_best_after: 500  # skip best.pt writes for this many steps

final_eval:
  enabled: true
  designer:
    _target_: testbed.designers.StaticDesigner

select:
  n_outer: 2_048
  n_contrastive: 1_000_000
  outer_batch_size: 256
  contrastive_chunk_size: 20_000
  fused: true
