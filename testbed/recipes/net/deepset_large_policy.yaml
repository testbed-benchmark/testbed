# DeepSets policy net sized to match net/attentive_policy, so that comparing the
# two isolates sum pooling against attention rather than against a smaller model.
#
# Sized component by component rather than by widening until the totals agree.
# On location finding the attentive net spends 33,920 parameters on its token
# MLP and 594,816 on three transformer blocks; phi = [528, 528, 528] -> 128
# absorbs 628,448 against that 628,736. dim_emb, the readout and the decoder
# are identical to attentive_policy, so pooling is the only thing that differs.
# Totals: 645,346 against 662,786, i.e. 0.97x, and 0.97x on every other
# task, since only phi's first layer moves with dim_y and dim_design.
#
# Depth is capped at three hidden layers on purpose. Zhang et al. (ICML 2022,
# "Set Norm and Equivariant Skip Connections") show vanilla DeepSets degrade
# catastrophically past that without set norm and residual connections, which
# DeepSetEncoder's plain MLP has neither of. The extra budget goes to width.
#
# dim_emb is 128 rather than deepset_policy's 16: the pooled embedding has to
# carry a T-step history, and DAD's 16 is a hard bottleneck at T = 30 to 50.
#
# GELU throughout, matching AttentiveEncoder's token MLP, so the activation is
# not a second confound. net/deepset_policy keeps ReLU because it reproduces
# DAD's own net, and is the "DeepSets (small)" row of the same table.
_target_: testbed.design_nets.DeepSetPolicyNet
encoder_dim_h: [528, 528, 528]
dim_emb: 128
encoder_activation:
  _target_: torch.nn.GELU
  _partial_: true
decoder_dim_h: [128]
decoder_activation:
  _target_: torch.nn.GELU
  _partial_: true
