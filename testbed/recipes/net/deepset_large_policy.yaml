# DeepSets policy net sized to match net/attentive_policy (0.97x its parameter
# count), so comparing the two isolates sum pooling against attention. dim_emb,
# the readout and the decoder match attentive_policy, and GELU is used
# throughout as in its token MLP.
#
# Depth is capped at three hidden layers: vanilla DeepSets degrade past that
# without set norm and residual connections (Zhang et al., ICML 2022).
_target_: testbed.design_nets.DeepSetPolicyNet
encoder_dim_h: [528, 528, 528]
dim_emb: 128
encoder_activation:
  _target_: torch.nn.GELU
  _partial_: true
decoder_dim_h: [128]
decoder_activation:
  _target_: torch.nn.GELU
  _partial_: true
