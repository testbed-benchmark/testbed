# Design network of the DAD location finding experiment (Foster et al. 2021,
# Appendix D.1): encoder [dim_design + dim_y -> 256 -> 16] with ReLU and sum
# pooling, then a linear emitter [16 -> 2 -> dim_design]. Unlike the paper, the
# null encoding is learnable.
_target_: testbed.design_nets.DeepSetPolicyNet
encoder_dim_h: [256]
dim_emb: 16
encoder_activation:
  _target_: torch.nn.ReLU
  _partial_: true
decoder_dim_h: [2]
decoder_activation: null
