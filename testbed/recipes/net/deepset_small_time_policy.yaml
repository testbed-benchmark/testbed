# net/deepset_policy with learned time embeddings switched on, for the
# architecture ablation. Every other value is identical, so the pair isolates
# what order-awareness contributes at DAD's own network size
#
# The embedding is concatenated onto each token, so with dim_time = dim_emb = 16
# the per-step input is [dim_design + dim_y + 16] rather than [dim_design + dim_y].
_target_: testbed.design_nets.TimeEmbeddedDeepSetPolicyNet
encoder_dim_h: [256]
dim_emb: 16
dim_time: 16
max_T: 128
encoder_activation:
  _target_: torch.nn.ReLU
  _partial_: true
decoder_dim_h: [2]
decoder_activation: null
