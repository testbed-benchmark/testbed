# @package _global_

# Task defaults, from https://arxiv.org/abs/2402.07868, with the diffusion
# matched to ScoreBED (https://github.com/angusphillips/Score_Matching_BED).
T: 50

task:
  _target_: testbed.tasks.CartPole
  dt: 0.05  # Euler-Maruyama step
  stiffness_c: 0.01  # k1
  stiffness_p: 0.01  # k2
  damping_c: 0.01  # d1
  damping_p: 0.01  # d2
  # L = 0.1 I: the SDE drives all four coordinates (ScoreBED's diffusion_mat).
  noise_scale: [0.1, 0.1, 0.1, 0.1]
  prior: null  # use the standard log-normal prior on (mp, mc, l)
  design_space: null  # derive the standard force range, -5 to 5
  reparameterize_outcomes: true  # Gaussian noise on a differentiable drift
