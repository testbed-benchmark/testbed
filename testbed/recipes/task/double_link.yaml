# @package _global_

# Task defaults, from Appendix D.4 of https://arxiv.org/abs/2402.07868.
T: 50

task:
  _target_: testbed.tasks.DoubleLink
  dt: 0.05  # Euler-Maruyama step
  # L = diag(0.1, 0.1) on qdot: the SDE drives the two angular velocities only.
  noise_scale: [0.0, 0.0, 0.1, 0.1]
  noise_jitter: 1.0e-6  # not in the paper; keeps the two angle densities non-degenerate
  prior: null  # use the standard log-normal prior on (m1, m2, l1, l2)
  design_space: null  # derive the standard torque ranges, -4 to 4 and -2 to 2
  reparameterize_outcomes: true  # Gaussian noise on a differentiable drift
