# @package _global_

# From Appendix D.5 of https://arxiv.org/abs/2111.02329.
T: 10

task:
  _target_: testbed.tasks.Pharmacokinetic
  mult_noise_scale: 0.1  # epsilon ~ N(0, 0.01), so sd 0.1
  add_noise_scale: 0.31622776601683794   # eta ~ N(0, 0.1), so sd sqrt(0.1)
  decay_const: 400.0  # D_V
  prior: null  # use the standard log-normal prior on (ka, ke, V)
  design_space: null  # derive the standard sampling times, 0 to 24 hours
  reparameterize_outcomes: true  # Gaussian noise on a differentiable mean
