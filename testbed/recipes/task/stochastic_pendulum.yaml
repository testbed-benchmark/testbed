# @package _global_

# From https://arxiv.org/abs/2402.07868 (the nonlinear formulation, with
# theta = (m, l)), with the diffusion matched to ScoreBED
# (https://github.com/angusphillips/Score_Matching_BED).
T: 50

task:
  _target_: testbed.tasks.StochasticPendulum
  dt: 0.05  # Euler-Maruyama step
  damping: 0.1  # d
  # L = 0.1 I: the SDE drives both the angle and the angular velocity.
  noise_scale: [0.1, 0.1]
  prior: null  # use the standard log-normal prior on (m, l)
  design_prior: null  # derive the standard torque range, -1 to 1
  reparameterize_outcomes: true  # Gaussian noise on a differentiable drift
