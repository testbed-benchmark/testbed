# DAD on hyperbolic temporal discounting, trained with the REINFORCE gradient
# estimator (DAD paper Eq. 16). Architecture and hyperparameters follow the
# DAD paper HTD experiment (Foster et al. 2021, Appendix D.2).

# system
device: 'cuda'
seed: 0
save_dir: ???

# task
task:
  _target_: testbed.tasks.HyperbolicTemporalDiscounting
  epsilon: 0.01
  exponent: 1.0
  temperature: 0.0          # true discrete sampling; REINFORCE handles the gradient
T: 20

# objective
objective:
  name: reinforce
  n_inner: 1_023            # contrastive samples for the sPCE reward
  baseline: null            # or leave_one_out for variance reduction
  # deterministic policy -> pathwise Reinforce with SPCE.reinforce_value (DAD Eq. 16)

# training
n_train_iter: 100_000
n_outer: 1_024

# optimizer
lr: 5e-5
grad_clip: 1.0

# eval
eval_every: 0               # eval is expensive here; off for this recipe
n_outer_eval: 1_024
n_inner_eval: 100_000

# design policy network
# DeepSets net in the spirit of the DAD paper: encoder [3 -> 256 -> 256 -> 16]
# + sum pooling, emitter [16 -> 128 -> 16 -> 2], ReLU throughout. Not an exact
# match to the paper's HTD net (Appendix D.2): that encoder takes the design only
# with two 16-dim heads gated by the binary outcome, uses softplus activations,
# a [16 -> 256 -> 256 -> 2] emitter, and a fixed-zero null encoding.
# The raw net output is mapped to valid HTD designs (D_1, R_0) automatically
# via task.design_space (an HTDDesignSpace, following Step-DAD).
design_net:
  _target_: testbed.design_nets.DeepSetPolicyNet
  encoder_dim_h: [256, 256]
  dim_emb: 16
  decoder_dim_h: [128, 16]
  decoder_activation:
    _target_: torch.nn.ReLU
    _partial_: true
